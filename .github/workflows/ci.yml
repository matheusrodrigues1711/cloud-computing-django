name: CI/CD Django

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar Django
        run: |
          python manage.py check

      - name: Executar migrações
        run: |
          python manage.py migrate

      - name: Login no Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: matheus1711.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Construir imagem Docker
        run: |
          docker build -t matheus1711.azurecr.io/cloud-computing-django:latest .

      - name: Publicar imagem no ACR
        run: |
          docker push matheus1711.azurecr.io/cloud-computing-django:latest